[project]
name = "market_research_crew"
version = "0.1.0"
description = "market_research_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=1.15.17",
    "crewai[google-genai,litellm,tools]>=1.15.12,<2.0.0",
    "fastapi>=0.141.1",
    "google-genai>=1.65.0",
    "groq>=1.6.0",
    "pydantic>=2.12.5",
    "streamlit>=1.44.0",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.7.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "b637702d-5154-49fb-b349-5e689828b522"
